    <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "WebApplication",
      "@id": "https://donmeter.com/stock/#app",
      "name": "주식 물타기 계산기 – 돈미터",
      "url": "https://donmeter.com/stock/",
      "description": "매수 내역(날짜, 주식 수, 1주 가격)과 지금 가격을 넣으면 평균 단가와 손익, 목표 수익률까지 손실을 줄이려면 지금 가격에 몇 주를 더 사야 하는지, 지금 팔면 증권거래세와 수수료를 떼고 얼마가 남는지 계산하는 무료 서비스입니다. 시세는 가져오지 않고, 입력은 사용자 브라우저에만 저장됩니다.",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "Web",
      "inLanguage": "ko-KR",
      "isAccessibleForFree": true,
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "KRW"
      },
      "isPartOf": {
        "@id": "https://donmeter.com/#website"
      }
    },
    {
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "현재가는 왜 직접 넣어야 하나요?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "공공데이터포털에서 받을 수 있는 주식 시세(금융위원회 주식시세정보)는 공공누리 4유형이라 광고가 붙은 사이트에서 다른 사람에게 보여 줄 수 없어요. 실시간 시세도 거래소·증권사와 따로 계약해야 해요. 그래서 증권 앱에 보이는 지금 가격과 내 평균 단가를 직접 넣는 방식으로 만들었어요."
          }
        },
        {
          "@type": "Question",
          "name": "물타기로 본전(0%)을 만들 수는 없나요?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "지금 가격으로 더 사면 평균 단가는 지금 가격에 가까워질 뿐, 지금 가격보다 낮아지지는 않아요. 그래서 손실을 -1%, -3%처럼 줄일 수는 있어도 0%로 만들려면 끝없이 사야 해요. 본전은 주가가 평균 단가까지 올라와야 돌아와요."
          }
        },
        {
          "@type": "Question",
          "name": "-20% 빠졌는데 왜 +25%가 올라야 본전인가요?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "떨어진 비율과 올라야 하는 비율의 기준이 달라서예요. 10,000원이 8,000원이 되면 20% 빠진 거지만, 8,000원이 다시 10,000원이 되려면 2,000원 ÷ 8,000원 = 25% 올라야 해요. 많이 빠질수록 이 차이는 더 커져요(-50%면 +100%)."
          }
        },
        {
          "@type": "Question",
          "name": "순익은 어떻게 계산하나요?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "지금 가격으로 모두 판다고 보고, 평가 금액에서 매도 수수료(0.015% 어림)와 증권거래세(0.20%), 살 때 낸 수수료를 빼고 매수 금액을 뺐어요. 수수료는 증권사마다 달라요. 대주주가 아니면 국내 상장주식 매매차익에는 양도세가 없고, 배당은 넣지 않았어요."
          }
        },
        {
          "@type": "Question",
          "name": "입력한 종목과 숫자는 어디에 저장되나요?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "이 브라우저의 저장소(localStorage)에만 저장돼요. 돈미터 서버로는 보내지 않고, 다른 기기나 브라우저에서는 보이지 않아요. 브라우저 기록을 지우면 함께 지워져요."
          }
        },
        {
          "@type": "Question",
          "name": "투자 조언인가요?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "아니에요. 넣은 숫자로 평균 단가와 손익을 셈해 보는 계산기예요. 물타기를 할지, 팔지는 각자 판단할 일이고, 돈미터는 특정 종목이나 매매를 권하지 않아요."
          }
        }
      ]
    }
  ]
}
