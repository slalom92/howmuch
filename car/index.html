          "@type": "Question",
          "name": "내 연봉에 맞는 차는 어떻게 정했나요?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "재무 가이드에서 흔히 권하는 \"차값은 세전 연봉의 50% 이내\" 기준을 썼어요. 연봉 4,500만 원이면 2,250만 원까지예요. 할부 이자, 보험료, 기름값 같은 유지비는 빠져 있어서 실제로는 이보다 넉넉하게 잡는 게 좋아요."
          }
        },
        {
          "@type": "Question",
          "name": "차값은 언제 가격인가요?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "2023년식 차를 비교하므로 2023년 당시(또는 그 연식 출시 때) 제조사가 발표한 기본 트림 가격을 썼어요. 옵션, 할인, 취등록세는 빠져 있어요. 가격을 찾지 못한 차는 지어내지 않고, 지금 중고 시세로만 판정해요."
          }
        },

          "@type": "Question",
          "name": "중고 시세는 어디서 가져왔나요?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "엔카가 매달 공개하는 시세 보도자료(2026년 10월, 2023년식, 주행거리 6만km, 무사고 기준)의 숫자를 그대로 옮겼어요. 엔카 사이트를 따로 긁어 오지는 않았고, 실제 매물 가격은 옵션과 상태에 따라 달라요."
          }
        },
        {
          "@type": "Question",
          "name": "3년 타면 사라진 돈은 무엇인가요?",

          }
        },
        {
          "@type": "Question",
          "name": "\"한 푼도 안 쓰고 1년에 사는 연봉\"은 무엇인가요?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "1년 실수령액이 차값과 같아지는 세전 연봉이에요. 2026년 연봉 실수령액표의 두 연봉 사이를 비례로 나눠 구했어요. 월급을 한 푼도 안 쓰고 1년 모아 그 차를 현금으로 사려면 이만큼 벌어야 한다는 뜻이고, 연봉 절반 기준으로 계산한 \"필요한 연봉\"과는 다른 숫자예요."

          }
        }
      ]
