          "name": "평균 관리비는 어디서 가져왔나요?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "아파트는 공동주택관리정보시스템(K-apt)에 공개된 2025년 9월부터 2026년 9월까지의 관리비를 한국부동산원이 집계한 값이에요. 전국 평균은 전용면적 1㎡당 2,957원이고, 서울은 3,411원, 경기는 3,451원이에요. 여기에 고른 전용면적을 곱했어요."
